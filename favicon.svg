<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <title>Nimit Mehra</title>
  <style>
    .logo { filter: url(#light); }
    @media (prefers-color-scheme: dark) { .logo { filter: url(#dark); } }
  </style>
  <defs>
    <filter id="light" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="outline"/>
      <feFlood flood-color="#ffffff"/>
      <feComposite in2="outline" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dark" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="outline"/>
      <feFlood flood-color="#203579"/>
      <feComposite in2="outline" operator="in" result="halo"/>
      <feFlood flood-color="#ffffff"/>
      <feComposite in2="SourceAlpha" operator="in" result="mark"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="mark"/></feMerge>
    </filter>
  </defs>
  <image class="logo" width="96" height="96" href="data:image/png;base64,"/>
</svg>
